[package]
name = "roll-model"
version = "0.6.0"
edition = "2021"
description = "Load MusicXML drum scores, capture MIDI from a Roland V31 and grade the performance"
license = "PolyForm-Noncommercial-1.0.0"

[features]
default = ["audio"]
# Audible metronome through the default sound output (rodio/cpal).
# Build with `--no-default-features` to drop it; the click can still be sent
# to the drum module over MIDI out.
audio = ["dep:rodio"]

[dependencies]
eframe = "0.29"
egui = "0.29"
midir = "0.10"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Reads the WAV files that replace built-in instrument sounds.
hound = "3"
rodio = { version = "0.19", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = "thin"
