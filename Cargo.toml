[package]
name = "roll-model"
version = "0.7.3"
edition = "2021"
description = "Load MusicXML drum scores, capture MIDI from a Roland V31 and grade the performance"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/pKasprowicz/roll-model"
readme = "README.md"
publish = false

[workspace]
members = ["core"]
# `cargo build` and `cargo test` cover the core crate too.
default-members = [".", "core"]

[features]
default = ["audio"]
# Audible metronome and software drum kit through the sound output (cpal).
# Build with `--no-default-features` to drop it; the click can still be sent
# to the drum module over MIDI out.
audio = ["dep:cpal"]

[dependencies]
roll-model-core = { path = "core" }
eframe = "0.29"
egui = "0.29"
midir = "0.10"
rfd = "0.15"
# Reads the WAV files that replace built-in instrument sounds.
hound = "3"
# Wait-free queue from the scheduler threads to the audio callback.
rtrb = "0.4"
cpal = { version = "0.17", optional = true }

[[example]]
name = "audio_probe"
required-features = ["audio"]

[profile.release]
opt-level = 3
lto = "thin"
