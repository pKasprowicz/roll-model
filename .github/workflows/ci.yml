name: CI

on:
  push:
    branches: [develop]
  # The Run workflow button on the Actions tab (needs write access to the repository).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tests on every push to develop, so a broken commit shows before a release.
# There is no pull_request trigger: the repository takes no outside pull requests,
# and nothing an outsider does should start a job here. GitHub-hosted runners only,
# with the toolchains the release builds use.
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ matrix.toolchain }}
          rustc -vV
      - uses: Swatinem/rust-cache@v2
      # The code is rustfmt-formatted (rustfmt.toml) and clippy reports nothing; one system is enough for both.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      # Release mode, like release.yml. (The scheduler's timing tests use a manual clock and no longer
      # depend on the speed of the build.)
      - name: Test
        run: cargo test --release --locked
      - name: Check without the sound card
        run: cargo check --locked --no-default-features
      # The manual and the developer guide read the source for their excerpts: a rename that leaves one
      # behind broke the 0.10.3 release only after the tag, so it is built here too.
      - name: Build the site
        if: runner.os == 'Linux'
        run: python3 tools/build_site.py --out site
