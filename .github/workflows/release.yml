name: Release

on:
  push:
    branches: [main]
    # `vX.Y.Z` is a release. `preview` is moved onto a commit of develop (git tag -f preview;
    # git push -f origin preview) to build a preview release from it.
    tags: ["v*.*.*", "preview"]

permissions:
  contents: write

# A newer preview replaces one that is still building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/tags/preview' }}

jobs:
  # A branch push of a commit that also carries a release tag is covered by the
  # tag run, so only untagged branch pushes and tag pushes build. The `preview`
  # tag builds only when its commit is on develop.
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "preview" ]; then
            if git merge-base --is-ancestor HEAD origin/develop; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::The preview tag is not on the develop branch, so nothing was built."
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$GITHUB_REF_TYPE" = "tag" ] || [ -z "$(git tag --points-at HEAD --list 'v*.*.*')" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # The user manual and the developer guide are one HTML file each, built from
  # docs/manual and docs/developer (the guide extracts its code from the source, so
  # a renamed item fails this job). THIRD_PARTY_NOTICES.txt holds the licence texts of every
  # dependency, which their licences require to accompany the binary. Both go into
  # both archives and are also release files.
  manual:
    name: Build the manual, developer guide and third-party notices
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_manual.py --label "${GITHUB_REF_NAME}" --out manual/roll-model-manual.html
      - run: python3 tools/build_devguide.py --label "${GITHUB_REF_NAME}" --out manual/roll-model-developer-guide.html
      - run: python3 tools/build_notices.py --out manual/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: |
            manual/roll-model-manual.html
            manual/roll-model-developer-guide.html
            manual/THIRD_PARTY_NOTICES.txt

  build-linux:
    name: Build Linux
    needs: [plan, manual]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manual
          path: manual
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          name="roll-model-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/roll-model README.md CHANGELOG.md LICENSE manual/roll-model-manual.html manual/roll-model-developer-guide.html manual/THIRD_PARTY_NOTICES.txt "$name/"
          cp -r examples "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: roll-model-*.tar.gz

  build-windows:
    name: Build Windows (self-hosted)
    needs: [plan, manual]
    if: needs.plan.outputs.build == 'true'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manual
          path: manual
      - name: Test
        shell: pwsh
        run: cargo test --release
      - name: Build
        shell: pwsh
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "roll-model-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/roll-model.exe, README.md, CHANGELOG.md, LICENSE, manual/roll-model-manual.html, manual/roll-model-developer-guide.html, manual/THIRD_PARTY_NOTICES.txt $name
          Copy-Item examples $name -Recurse
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: roll-model-*.zip

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/preview'
    needs: [build-linux, build-windows, manual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
      # The same release is updated each time: its files are replaced and it
      # points at the newest preview commit.
      - name: Short commit id
        if: github.ref == 'refs/tags/preview'
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/tags/preview'
        with:
          name: Preview ${{ steps.sha.outputs.short }}
          body: Preview build of the develop branch at commit ${{ steps.sha.outputs.short }}. It may be unfinished; use the latest vX.Y.Z release for everyday use.
          prerelease: true
          files: dist/*
