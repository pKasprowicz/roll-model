name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  # A branch push of a commit that also carries a release tag is covered by the
  # tag run, so only untagged branch pushes and tag pushes build.
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ -z "$(git tag --points-at HEAD --list 'v*.*.*')" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Build Linux
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          name="roll-model-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/roll-model README.md CHANGELOG.md "$name/"
          cp -r examples "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: roll-model-*.tar.gz

  build-windows:
    name: Build Windows (self-hosted)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: pwsh
        run: cargo test --release
      - name: Build
        shell: pwsh
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "roll-model-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/roll-model.exe, README.md, CHANGELOG.md $name
          Copy-Item examples $name -Recurse
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: roll-model-*.zip

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
